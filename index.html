<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戰神賽特 - 6x5 全盤消除示範</title>
    <style>
        body {
            background-color: #120e09;
            color: #f3e5ab;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }
        #game-container {
            border: 4px solid #b8860b;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.6);
            border-radius: 8px;
            overflow: hidden;
            background: #1c140d;
        }
        canvas {
            display: block;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            color: #000;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 10px rgba(255, 215, 0, 0.4);
        }
        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .info-panel {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>戰神賽特 SETH - 全場消除轉盤</h1>
    <div id="game-container">
        <canvas id="slotCanvas" width="600" height="500"></canvas>
    </div>
    
    <div class="controls">
        <button id="spinBtn">SPIN (旋轉)</button>
        <div class="info-panel">贏分: $<span id="winDisplay">0</span></div>
    </div>

<script>
const canvas = document.getElementById('slotCanvas');
const ctx = canvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');
const winDisplay = document.getElementById('winDisplay');

// 盤面設定
const COLS = 6;
const ROWS = 5;
const CELL_SIZE = 90;
const OFFSET_X = (canvas.width - COLS * CELL_SIZE) / 2;
const OFFSET_Y = (canvas.height - ROWS * CELL_SIZE) / 2;

// 符號定義與顏色代表
const SYMBOLS = [
    { id: 'ANKH', label: '☥ 安卡', color: '#ff4500' },
    { id: 'EYE', label: '👁️ 荷魯斯', color: '#00bfff' },
    { id: 'SCARAB', label: '🪲 聖甲蟲', color: '#32cd32' },
    { id: 'RUBY', label: '💎 紅寶石', color: '#e60073' },
    { id: 'SETH', label: '📿 賽特首飾', color: '#ffd700' }
];

// 賠率設定 (8+, 10+, 12+)
const PAY_TABLE = {
    8: 10,
    10: 25,
    12: 100
};

// 6x5 遊戲盤面矩陣
let grid = [];
let isAnimating = false;

// 1. 初始化盤面
function initGrid() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
        let row = [];
        for (let c = 0; c < COLS; c++) {
            row.push(getRandomSymbol());
        }
        grid.push(row);
    }
}

function getRandomSymbol() {
    return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
}

// 2. 繪製盤面與符號
function drawBoard(highlightCoords = []) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const x = OFFSET_X + c * CELL_SIZE;
            const y = OFFSET_Y + r * CELL_SIZE;
            const symbol = grid[r][c];

            // 畫格子外框
            ctx.strokeStyle = '#4a3b2c';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

            if (!symbol) continue; // 消除後為空

            // 是否為中獎符號 (加強光圈)
            const isMatch = highlightCoords.some(coord => coord.r === r && coord.c === c);
            if (isMatch) {
                ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
                ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.strokeRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
            } else {
                ctx.fillStyle = '#261b12';
                ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
            }

            // 繪製符號文字
            ctx.fillStyle = symbol.color;
            ctx.font = 'bold 18px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(symbol.label, x + CELL_SIZE / 2, y + CELL_SIZE / 2);
        }
    }
}

// 3. 全盤任意位置匹配計算 (Scatter-Pay)
function evaluateMatches() {
    const counts = {};
    const coordsMap = {};

    // 統計全盤數量與座標
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const sym = grid[r][c];
            if (!sym) continue;
            if (!counts[sym.id]) {
                counts[sym.id] = 0;
                coordsMap[sym.id] = [];
            }
            counts[sym.id]++;
            coordsMap[sym.id].push({ r, c });
        }
    }

    let totalWin = 0;
    let winningCoords = [];

    // 對照賠率表結算
    for (let symId in counts) {
        const count = counts[symId];
        let multiplier = 0;

        if (count >= 12) multiplier = PAY_TABLE[12];
        else if (count >= 10) multiplier = PAY_TABLE[10];
        else if (count >= 8) multiplier = PAY_TABLE[8];

        if (multiplier > 0) {
            totalWin += multiplier;
            winningCoords = winningCoords.concat(coordsMap[symId]);
        }
    }

    return { totalWin, winningCoords };
}

// 4. 消除與下落邏輯 (Tumble Cycle)
async function processTumbles() {
    let roundWin = 0;

    while (true) {
        const { totalWin, winningCoords } = evaluateMatches();
        
        if (winningCoords.length === 0) break; // 沒有可以消除的項目，結束連鎖

        roundWin += totalWin;
        winDisplay.innerText = parseInt(winDisplay.innerText) + totalWin;

        // 高亮顯示中獎項目
        drawBoard(winningCoords);
        await sleep(600); // 展示消除前閃爍

        // 移除中獎符號 (設為 null)
        winningCoords.forEach(({ r, c }) => {
            grid[r][c] = null;
        });
        drawBoard();
        await sleep(300);

        // 符號下落與補滿頂部
        applyGravityAndRefill();
        drawBoard();
        await sleep(400);
    }
}

// 重力下落算法
function applyGravityAndRefill() {
    for (let c = 0; c < COLS; c++) {
        // 從底部向上整理非空符號
        let emptyRow = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
            if (grid[r][c] !== null) {
                grid[emptyRow][c] = grid[r][c];
                if (emptyRow !== r) grid[r][c] = null;
                emptyRow--;
            }
        }
        // 頂部補新符號
        for (let r = emptyRow; r >= 0; r--) {
            grid[r][c] = getRandomSymbol();
        }
    }
}

// 輔助延遲函數
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// 5. Spin 按鈕事件觸發
spinBtn.addEventListener('click', async () => {
    if (isAnimating) return;
    isAnimating = true;
    spinBtn.disabled = true;
    winDisplay.innerText = '0';

    // 模擬快速滾動刷新
    for (let i = 0; i < 10; i++) {
        initGrid();
        drawBoard();
        await sleep(50);
    }

    // 開始進行全場連鎖消除
    await processTumbles();

    spinBtn.disabled = false;
    isAnimating = false;
});

// 初始化畫布
initGrid();
drawBoard();
</script>

</body>
</html>
